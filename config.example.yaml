# Break Signal — configuration
# Copy to config.yaml and fill in the secrets. config.yaml is gitignored.

exchange: okx                 # okx | binance — where candles come from (REST backfill +
                              # live stream). Symbols stay OKX-style instIds either way;
                              # the Binance provider translates (SOL-USDT-SWAP -> SOLUSDT
                              # on USDⓈ-M futures). Switch if your ISP blocks one of them.
                              # Hosts: OKX_REST_URL / OKX_WS_URL / BINANCE_REST_URL /
                              # BINANCE_WS_URL override the defaults.

# One watcher is started per (symbol, timeframe) pair.
watches:
  - symbol: SOL-USDT-SWAP     # OKX instId (perpetual)
    timeframe: "1D"           # OKX bar: 1D, 4H, 1H, 12H, ...
  - symbol: SOL-USDT-SWAP
    timeframe: "4H"

# ── Algorithm parameters (STRICT defaults, must mirror pine/break_signal.pine) ──
params:
  pivot_len_auto: true        # true -> 5 on >=1D, 8 on >=4H, else 10
  pivot_len: 5                # used only when pivot_len_auto is false
  use_fine_pivots: true       # ALSO detect a finer pivot scale (catches consolidation
                              # trendlines a human draws that the coarse scale misses)
  pivot_len_fine: 3           # the finer fractal lookback merged with the coarse one
  max_pivots: 10              # pivots kept per side (cap on the MERGED set)
  max_age: 400                # forget pivots older than N bars
  look_max: 300               # validation window (bars)
  min_bars: 10                # min bars between two anchors
  min_touches: 3              # anchors + at least one more
  max_violations: 0           # closes allowed through a line (0 = strict)
  atr_valid: 0.10             # validity tolerance (xATR)
  atr_touch: 0.25             # touch tolerance (xATR)
  max_dist: 12.0              # ignore lines further than N xATR from price
  max_lines: 3                # kept per side
  atr_break: 0.30             # break buffer (xATR)
  use_volume: true            # require volume expansion
  vol_mult: 1.5               # volume vs SMA20 multiple
  use_body: true              # require a decisive candle body
  body_min: 0.5               # min body / range
  two_bar: false              # require 2 consecutive closes beyond the line

backfill: 500                 # candles fetched on startup

# ── Notifications. Failures are isolated: Discord down never blocks Telegram. ──
channels:
  telegram:
    enabled: true
    bot_token: ""             # from @BotFather
    chat_id: ""               # your chat/channel id
  discord:
    enabled: true
    webhook_url: ""           # channel -> Integrations -> Webhooks

render_chart: true            # attach a chart PNG to each alert
chart_bars: 120               # candles shown in the snapshot

state_db: data/state.db       # SQLite path; the ./data dir is the mounted Docker volume
                              # (on a Pi, back ./data with an SSD/USB, not the SD card)
log_level: INFO

# ── Trade journal (python -m break_signal.journal ...) ──
journal:
  db: data/journal.db         # separate file from state.db
  screenshots_dir: data/journal/screenshots
  symbol_aliases:             # "SOL" in a /trade line -> OKX instId
    SOL: SOL-USDT-SWAP
    BTC: BTC-USDT-SWAP
    ETH: ETH-USDT-SWAP
  history_footer: true        # append "your history" to alerts when n >= 3 (phase J2)
  account_size: null          # optional; enables risk_pct auto-calc from risk_amount
  backup_dir: data/backups    # nightly .db snapshot + .md export; null disables
  backup_time: "00:05"        # UTC
  backup_keep: 14             # snapshots to retain

# ── Telegram command bot: /trade /close /skip /event /list /show /stats /ask /review ──
# Uses channels.telegram.bot_token. Only allowed_chat_ids may write to the journal.
telegram_bot:
  enabled: false
  allowed_chat_ids: []        # e.g. ["123456789"]; empty = nobody can use commands
  poll_timeout: 30

# ── HTTP: dashboard + TradingView webhook on one port ──
web:
  enabled: false
  host: 0.0.0.0
  port: 8787
  dashboard: true             # dashboard at http://<pi>:8787/ — LAN only, reads need no auth
  write_token: ""             # empty = read-only. Set a long random string to enable the
                              # command bar (log/close/edit from the page); it is sent as
                              # the X-Journal-Token header and checked on every write.

# The Pine indicator's alert() JSON → journal signals (source=pine).
# In TradingView: alert → Webhook URL = http://<pi>:8787/pine/<secret>. Needs a route in from
# the internet (port-forward / tunnel) for that path only; the secret is the only auth.
webhook:
  enabled: false
  secret: ""                  # long random string; required when enabled
  notify: false               # also push pine alerts (with the journal footer) to Telegram/Discord

# ── AI coach (Telegram /ask and /review, weekly report). Needs requirements-ai.txt. ──
ai:
  enabled: false
  provider: auto              # auto | gemini | anthropic. auto = gemini when the model name
                              # contains "gemini" or only GEMINI_API_KEY is set, else anthropic
  model: claude-opus-5        # or gemini-3.6-flash (set provider/model together)
  max_tokens: 16000
  max_tool_calls: 8           # tool-call rounds per /ask (both providers)
  daily_ask_limit: 30
  weekly_report: true
  weekly_report_cron: "MON 00:15"   # UTC
  api_key: ""                 # empty → GEMINI_API_KEY or ANTHROPIC_API_KEY from the environment
