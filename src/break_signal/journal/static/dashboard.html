<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262a33; --fg:#d7dae0; --muted:#8b91a0;
          --up:#2a9d8f; --dn:#e76f51; --res:#e9c46a; --sup:#4cc9f0; --accent:#a78bfa; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap }
  header h1 { font-size:16px; margin:0 12px 0 0; font-weight:600 }
  select, button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit }
  button { cursor:pointer } button:hover { border-color:var(--accent) }
  main { display:grid; grid-template-columns: 2fr 1fr; gap:12px; padding:12px 16px }
  @media (max-width: 1000px) { main { grid-template-columns:1fr } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; min-width:0; overflow:hidden }
  main > .stack { min-width:0 }
  .panel h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px }
  #chart { height:460px } #equity { height:160px }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px }
  .stat { background:var(--bg); border-radius:8px; padding:8px 10px }
  .stat .k { color:var(--muted); font-size:11px } .stat .v { font-size:18px; font-weight:600 }
  table { width:100%; border-collapse:collapse; font-size:13px }
  th, td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); white-space:nowrap }
  th { color:var(--muted); font-weight:500 }
  .pos { color:var(--up) } .neg { color:var(--dn) } .muted { color:var(--muted) }
  .tag { display:inline-block; background:var(--bg); border-radius:4px; padding:1px 6px; margin-right:4px; font-size:12px }
  .err { color:var(--dn); padding:8px }
  .stack { display:flex; flex-direction:column; gap:12px }
  .scroll { max-height:260px; overflow:auto }
  .legend { display:flex; gap:14px; color:var(--muted); font-size:12px; margin-top:6px; flex-wrap:wrap }
  .legend i { display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:5px }
  /* command bar (only rendered when web.write_token is set) */
  #cmdbar { display:none; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel) }
  #cmdbar.on { display:block }
  #cmdrow { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  #cmd { flex:1; min-width:240px; background:var(--bg); color:var(--fg); border:1px solid var(--line);
         border-radius:6px; padding:8px 10px; font:inherit }
  #cmd:focus { outline:none; border-color:var(--accent) }
  #cmdout { margin-top:8px; font-size:13px; min-height:18px }
  #cmdhelp { margin-top:8px; color:var(--muted); font-size:12px; white-space:pre-wrap; display:none }
  #cmdhelp.on { display:block }
  .btn-xs { padding:2px 7px; font-size:12px; border-radius:5px; background:var(--bg);
            color:var(--muted); border:1px solid var(--line); cursor:pointer }
  .btn-xs:hover { color:var(--fg); border-color:var(--accent) }
  td.act { white-space:nowrap } td.act button { margin-right:4px }
</style>
</head>
<body>
<header>
  <h1 style="display:flex;align-items:center;gap:8px">
    <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true" style="flex:none">
      <rect width="32" height="32" rx="7" fill="#171a21"/>
      <line x1="5" y1="18" x2="27" y2="18" stroke="#e9c46a" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>
      <path d="M16 27 L16 8" stroke="#2a9d8f" stroke-width="3" stroke-linecap="round"/>
      <path d="M9 15 L16 7 L23 15" fill="none" stroke="#2a9d8f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Break Signal · journal</h1>
  <input id="symbol" list="symbol-list" placeholder="e.g. BTC" autocomplete="off"
         style="text-transform:uppercase; width:160px; background:var(--panel); color:var(--fg);
                border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit">
  <datalist id="symbol-list"></datalist>
  <select id="tf"></select>
  <button id="reload">Reload</button>
  <span id="status" class="muted"></span>
</header>
<section id="cmdbar">
  <div id="cmdrow">
    <input id="cmd" autocomplete="off" spellcheck="false"
           placeholder='add SOL 4H long 231.5 sl 225 #breakout -- clean retest     ·     close 2 1.35 hit TP     ·     sl 2 1.27'>
    <button id="run">Run</button>
    <button id="helpbtn" class="btn-xs" title="command syntax">?</button>
    <button id="tokenbtn" class="btn-xs" title="change the write token">token</button>
  </div>
  <div id="cmdout"></div>
  <div id="cmdhelp"></div>
</section>
<main>
  <div class="stack">
    <div class="panel">
      <h2>Chart · lines · alerts · trades</h2>
      <div id="chart"></div>
      <div class="legend">
        <span><i style="background:var(--res)"></i>resistance</span>
        <span><i style="background:var(--sup)"></i>support</span>
        <span>▲/▼ alert (stored signal)</span>
        <span>◆ trade entry · ✕ exit</span>
      </div>
      <div id="chart-info" class="muted" style="margin-top:6px"></div>
    </div>
    <div class="panel"><h2>Equity (cumulative R)</h2><div id="equity"></div></div>
    <div class="panel"><h2>Recent trades</h2><div class="scroll" id="trades"></div></div>
  </div>
  <div class="stack">
    <div class="panel">
      <h2>Watchlist <span id="wl-updated" class="muted" style="text-transform:none;letter-spacing:0;font-weight:400;font-size:11px"></span></h2>
      <div id="wl-add" style="display:none; gap:6px; margin-bottom:8px">
        <input id="wl-sym" placeholder="SYMBOL e.g. DOGE-USDT-SWAP" autocomplete="off"
               style="flex:1;min-width:0;text-transform:uppercase;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit">
        <button id="wl-addbtn" class="btn-xs">add</button>
      </div>
      <div class="scroll" id="watchlist"></div>
    </div>
    <div class="panel">
      <h2>Price alerts <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400;font-size:11px">· one-shot → Telegram</span></h2>
      <div id="al-add" style="display:none; flex-wrap:wrap; gap:6px; margin-bottom:8px">
        <input id="al-sym" placeholder="SYMBOL"
               style="width:150px;text-transform:uppercase;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit">
        <select id="al-op"><option value="&gt;=">≥</option><option value="&lt;=">≤</option></select>
        <input id="al-price" type="number" step="any" placeholder="price"
               style="width:100px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit">
        <input id="al-note" placeholder="note (optional)"
               style="flex:1;min-width:120px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit">
        <button id="al-addbtn" class="btn-xs">add alert</button>
      </div>
      <div class="scroll" id="alerts"></div>
    </div>
    <div class="panel"><h2>All time</h2><div class="stats" id="stats-all"></div></div>
    <div class="panel"><h2>Last 30 days</h2><div class="stats" id="stats-30"></div></div>
    <div class="panel"><h2>Open trades</h2><div id="open"></div></div>
    <div class="panel"><h2>By entry tag</h2><div class="scroll" id="tags"></div></div>
    <div class="panel"><h2>Coach memory</h2><div id="memories"></div></div>
    <div class="panel"><h2>Recent alerts</h2><div class="scroll" id="signals"></div></div>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const fmt = (x, d = 2) => (x == null ? '–' : (typeof x === 'string' ? x : x.toFixed(d)));
const pct = (x) => (x == null ? '–' : Math.round(x * 100) + '%');
const cls = (x) => (x == null ? '' : x >= 0 ? 'pos' : 'neg');
// Decimals to show for a price, scaled to its magnitude so sub-dollar coins
// (0.7109, 0.006416…) aren't collapsed to 0.71 / 0.01 on the axis.
function precisionFor(p) {
  const a = Math.abs(p || 0);
  if (a >= 100) return 2;
  if (a >= 10) return 3;
  if (a >= 1) return 4;
  if (a >= 0.1) return 4;
  if (a >= 0.01) return 5;
  if (a >= 0.001) return 6;
  return 8;
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function j(url) { const r = await fetch(url); if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || r.statusText); } return r.json(); }

// ── charts ──────────────────────────────────────────────────────────────────
const chartOpts = { autoSize: true, layout: { background: { color: '#171a21' }, textColor: '#d7dae0' },
  grid: { vertLines: { color: '#262a33' }, horzLines: { color: '#262a33' } },
  timeScale: { timeVisible: true, borderColor: '#262a33' }, rightPriceScale: { borderColor: '#262a33' } };
const chart = LightweightCharts.createChart($('#chart'), chartOpts);
const candles = chart.addCandlestickSeries({ upColor: '#2a9d8f', downColor: '#e76f51', wickUpColor: '#2a9d8f', wickDownColor: '#e76f51', borderVisible: false });
let lineSeries = [];
const eqChart = LightweightCharts.createChart($('#equity'), { ...chartOpts, timeScale: { visible: false } });
const eqSeries = eqChart.addLineSeries({ color: '#a78bfa', lineWidth: 2 });

async function loadChart(fit = true) {
  const symbol = $('#symbol').value, tf = $('#tf').value;
  // `fit` = a manual load (fit the view + show status). Auto-refresh passes
  // false so the viewer's zoom/pan is preserved and the status bar doesn't blink.
  if (fit) $('#status').textContent = 'loading chart…';
  lineSeries.forEach(s => chart.removeSeries(s)); lineSeries = [];
  try {
    const d = await j(`/api/chart?symbol=${encodeURIComponent(symbol)}&tf=${encodeURIComponent(tf)}&bars=300`);
    candles.setData(d.candles);
    const snap = d.snapshot;
    // Scale the axis decimals to this instrument's price so cheap coins read true.
    const refPrice = d.candles.length ? d.candles[d.candles.length - 1].close : (snap.price || 0);
    const prec = precisionFor(refPrice);
    candles.applyOptions({ priceFormat: { type: 'price', precision: prec, minMove: Math.pow(10, -prec) } });
    for (const ln of snap.lines || []) {
      const s = chart.addLineSeries({ color: ln.side === 'resistance' ? '#e9c46a' : '#4cc9f0', lineWidth: 1, lastValueVisible: false, priceLineVisible: false });
      s.setData([{ time: ln.anchor_ts / 1000, value: ln.anchor_value }, { time: ln.last_ts / 1000, value: ln.value }]);
      lineSeries.push(s);
    }
    const markers = [];
    for (const s of d.signals) markers.push({ time: s.candle_ts / 1000, position: s.event === 'break_up' ? 'belowBar' : 'aboveBar',
      color: s.event === 'break_up' ? '#2a9d8f' : '#e76f51', shape: s.event === 'break_up' ? 'arrowUp' : 'arrowDown', text: `#${s.id} ${s.source}` });
    for (const t of d.trades) {
      if (t.opened_ts) markers.push({ time: t.opened_ts / 1000, position: 'belowBar', color: '#a78bfa', shape: 'circle', text: `#${t.id} ${t.direction}` });
      if (t.closed_ts) markers.push({ time: t.closed_ts / 1000, position: 'aboveBar', color: t.r_multiple >= 0 ? '#2a9d8f' : '#e76f51', shape: 'square', text: `#${t.id} ${fmt(t.r_multiple)}R` });
    }
    markers.sort((a, b) => a.time - b.time);
    candles.setMarkers(markers);
    if (fit) chart.timeScale().fitContent();
    const sig = snap.last_bar_signal ? ` · <b>${snap.last_bar_signal.event}</b> on last bar` : '';
    $('#chart-info').innerHTML = `as of ${snap.as_of} · price ${fmt(snap.price, prec)} · ATR ${fmt(snap.atr, prec)} · RSI ${fmt(snap.rsi, 1)} · vol ${fmt(snap.vol_ratio)}× · ${(snap.lines || []).length} lines${sig}`;
    $('#status').textContent = '';
  } catch (e) {
    candles.setData([]); candles.setMarkers([]);
    $('#chart-info').innerHTML = `<span class="err">chart unavailable: ${esc(e.message)}</span>`;
    $('#status').textContent = '';
  }
}

// ── panels ──────────────────────────────────────────────────────────────────
function stats(el, s) {
  const items = [['trades', s.n], ['win', pct(s.win_rate)], ['avg R', fmt(s.avg_r)], ['total R', fmt(s.total_r)],
    ['PF', s.profit_factor == null ? '–' : (typeof s.profit_factor === 'number' ? fmt(s.profit_factor) : s.profit_factor)],
    ['max DD', fmt(s.max_drawdown_r) + 'R'], ['W/L/BE', `${s.wins}/${s.losses}/${s.be}`],
    ['streak', `${s.streaks.current} ${s.streaks.current_kind || ''}`]];
  el.innerHTML = items.map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
}
function tradeRow(t, actions = false) {
  const openAct = actions && canWrite ? `
    <button class="btn-xs" data-cmd="close ${t.id} ">close</button>
    <button class="btn-xs" data-cmd="sl ${t.id} ">sl</button>
    <button class="btn-xs" data-cmd="tag ${t.id} #">tag</button>` : '';
  const noteBtn = canWrite ? `<button class="btn-xs" data-cmd="note ${t.id} ">note</button>` : '';
  const act = (openAct || noteBtn) ? `<td class="act">${openAct}${noteBtn}</td>` : '';
  // Build a tooltip + detail snippet from reasons / notes
  const meta = [];
  if (t.entry_reason) meta.push(`Entry: ${t.entry_reason}`);
  if (t.exit_reason) meta.push(`Exit: ${t.exit_reason}`);
  if (t.notes) meta.push(`Note: ${t.notes}`);
  const hasNote = meta.length > 0;
  const badge = hasNote ? ` <span title="${esc(meta.join(' | '))}" style="cursor:help">📝</span>` : '';
  const detailRow = hasNote ? `<tr class="note-detail" style="display:none"><td colspan="13" style="padding:6px 12px;white-space:normal;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)">${meta.map(m => `<div>${esc(m)}</div>`).join('')}</td></tr>` : '';
  return `<tr class="trade-row" style="cursor:${hasNote ? 'pointer' : 'default'}" data-has-note="${hasNote}"><td>#${t.id}${badge}</td><td>${t.status}</td><td>${esc(t.symbol)} ${esc(t.tf || '')}</td><td>${t.direction}</td>
    <td>${fmt(t.entry_price, 4)}</td><td>${fmt(t.sl_price, 4)}</td><td>${fmt(t.tp_price, 4)}</td><td>${fmt(t.exit_price, 4)}</td>
    <td>${t.outcome || ''}</td><td class="${cls(t.r_multiple)}">${t.r_multiple == null ? '' : fmt(t.r_multiple) + 'R'}</td>
    <td>${(t.entry_tags || []).concat(t.exit_tags || []).map(x => `<span class="tag">${esc(x)}</span>`).join('')}</td>
    <td class="muted">${esc(t.opened || '')}</td>${act}</tr>${detailRow}`;
}
async function loadPanels() {
  const s = await j('/api/summary');
  stats($('#stats-all'), s.all_time); stats($('#stats-30'), s.last_30d);
  eqSeries.setData(s.equity_curve.map((p, i) => ({ time: i + 1, value: p.cum_r }))); eqChart.timeScale().fitContent();
  $('#open').innerHTML = s.open_trades.length ? `<table>${s.open_trades.map(t => tradeRow(t, true)).join('')}</table>` : '<div class="muted">none</div>';
  const tags = Object.entries(s.tag_stats_entry);
  $('#tags').innerHTML = tags.length ? `<table><tr><th>tag</th><th>n</th><th>win</th><th>avg R</th></tr>${tags.map(([k, v]) =>
    `<tr><td>${esc(k)}</td><td>${v.n}</td><td>${pct(v.win_rate)}</td><td class="${cls(v.avg_r)}">${fmt(v.avg_r)}</td></tr>`).join('')}</table>` : '<div class="muted">none</div>';
  $('#memories').innerHTML = s.memories.length ? s.memories.map(m => `<div>${m.confirmed ? '✓' : '·'} <span class="muted">[${m.type}]</span> ${esc(m.content)}</div>`).join('')
    : '<div class="muted">nothing yet — appears at 5+ trades on a pattern or 3+ rule breaks</div>';
  const tr = await j('/api/trades?limit=30');
  $('#trades').innerHTML = tr.trades.length ? `<table><tr><th>id</th><th>status</th><th>sym</th><th>dir</th><th>entry</th><th>sl</th><th>tp</th><th>exit</th><th>out</th><th>R</th><th>tags</th><th>opened</th></tr>${tr.trades.map(t => tradeRow(t)).join('')}</table>` : '<div class="muted">no trades yet</div>';
  const sg = await j('/api/signals?limit=20');
  $('#signals').innerHTML = sg.length ? `<table><tr><th>id</th><th>src</th><th>sym</th><th>tf</th><th>event</th><th>price</th><th>rsi</th><th>candle</th></tr>${sg.map(x =>
    `<tr><td>#${x.id}</td><td>${x.source}</td><td>${esc(x.symbol)}</td><td>${x.tf}</td><td class="${x.event === 'break_up' ? 'pos' : 'neg'}">${x.event}</td><td>${fmt(x.price, 4)}</td><td>${fmt(x.rsi, 1)}</td><td class="muted">${x.candle}</td></tr>`).join('')}</table>` : '<div class="muted">none</div>';
}

// ── writing (only when the server has web.write_token) ──────────────────────
let canWrite = false;
// Per-viewer convenience only; the token never leaves this browser and the
// server re-checks it on every call. Storage can throw in a private window.
const store = {
  get() { try { return localStorage.getItem('journal_token') || ''; } catch { return ''; } },
  set(v) { try { localStorage.setItem('journal_token', v); } catch { /* not fatal */ } },
};
function say(msg, kind) {
  $('#cmdout').innerHTML = msg ? `<span class="${kind || ''}">${esc(msg)}</span>` : '';
}
function askToken(why) {
  const t = prompt(why || 'Write token (web.write_token in config.yaml):', store.get() || '');
  if (t !== null) store.set(t.trim());
  return store.get();
}
async function runCmd(cmd) {
  if (!cmd.trim()) return;
  let token = store.get() || askToken();
  if (!token) return say('no token — writes are refused', 'err');
  say('running…', 'muted');
  const r = await fetch('/api/do', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Journal-Token': token },
    body: JSON.stringify({ cmd }),
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 403) {
    say('token rejected', 'err');
    if (askToken('That token was rejected. Try again:')) runCmd(cmd);
    return;
  }
  if (!r.ok) return say(d.error || `HTTP ${r.status}`, 'err');
  const warn = (d.rule_violations || []).map(v => `⚠ ${v.name} (${v.detail})`).join('  ');
  say(d.message + (warn ? '   ' + warn : ''), warn ? 'neg' : 'pos');
  $('#cmd').value = '';
  await Promise.all([loadPanels(), loadChart()]);
}
function wireWrites(cfg) {
  canWrite = !!cfg.writes;
  if (!canWrite) return;
  $('#cmdbar').classList.add('on');
  $('#cmdhelp').textContent = cfg.help || '';
  $('#run').onclick = () => runCmd($('#cmd').value);
  $('#cmd').addEventListener('keydown', e => { if (e.key === 'Enter') runCmd($('#cmd').value); });
  $('#helpbtn').onclick = () => $('#cmdhelp').classList.toggle('on');
  $('#tokenbtn').onclick = () => { if (askToken()) say('token saved in this browser', 'muted'); };
  // the per-trade buttons prefill the box rather than acting, so nothing is
  // written by a single mis-click
  document.addEventListener('click', e => {
    const b = e.target.closest('button[data-cmd]');
    if (!b) return;
    $('#cmd').value = b.dataset.cmd;
    $('#cmd').focus();
  });
  // Click trade row to expand/collapse notes detail
  document.addEventListener('click', e => {
    const row = e.target.closest('tr.trade-row[data-has-note="true"]');
    if (!row || e.target.closest('button')) return;  // don't toggle when clicking buttons
    const detail = row.nextElementSibling;
    if (detail && detail.classList.contains('note-detail')) {
      detail.style.display = detail.style.display === 'none' ? '' : 'none';
    }
  });
}

// ── watchlist + price alerts ─────────────────────────────────────────────────
let wlPrices = {};
let wlPollSeconds = 5;   // refresh cadence, taken from the server's config
async function postJSON(url, body) {
  let token = store.get() || askToken();
  if (!token) { say('no token — writes refused', 'err'); return null; }
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Journal-Token': token }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (r.status === 403) { say('token rejected', 'err'); if (askToken('That token was rejected. Try again:')) return postJSON(url, body); return null; }
  if (!r.ok) { say(d.error || `HTTP ${r.status}`, 'err'); return null; }
  return d;
}
function wlRow(sym) {
  const p = wlPrices[sym] || {};
  const last = p.last == null ? '–' : (+p.last).toLocaleString(undefined, { maximumSignificantDigits: 6 });
  const ch = p.change24h;
  const chTxt = ch == null ? '' : (ch >= 0 ? '+' : '') + ch.toFixed(2) + '%';
  const rm = canWrite ? `<button class="btn-xs" data-wl-rm="${esc(sym)}" title="remove">✕</button>` : '';
  const al = canWrite ? `<button class="btn-xs" data-al-for="${esc(sym)}" title="set alert">alert</button>` : '';
  return `<tr><td><a href="#" data-wl-sym="${esc(sym)}" style="color:var(--fg);text-decoration:none">${esc(sym)}</a></td>
    <td style="text-align:right">${last}</td>
    <td style="text-align:right" class="${cls(ch)}">${chTxt}</td>
    <td class="act">${al}${rm}</td></tr>`;
}
function alRow(a) {
  const status = a.active ? '<span class="pos">armed</span>'
    : (a.triggered_ts ? `<span class="muted">fired ${new Date(a.triggered_ts).toLocaleString()}</span>` : '<span class="muted">off</span>');
  const acts = canWrite ? `
    <button class="btn-xs" data-al-toggle="${a.id}" data-al-active="${a.active ? 0 : 1}">${a.active ? 'disable' : 'arm'}</button>
    <button class="btn-xs" data-al-rm="${a.id}" title="delete">✕</button>` : '';
  return `<tr><td>#${a.id}</td><td>${esc(a.symbol)}</td><td>${esc(a.op)} ${fmt(a.price, 4)}</td><td>${status}</td><td class="act">${acts}</td></tr>`;
}
async function loadWatchlist() {
  let d; try { d = await j('/api/watchlist'); } catch { return; }
  wlPrices = d.prices || {};
  if (d.poll_seconds) wlPollSeconds = d.poll_seconds;
  const syms = d.symbols || [];
  $('#watchlist').innerHTML = syms.length
    ? `<table><tr><th>symbol</th><th style="text-align:right">price</th><th style="text-align:right">24h</th><th></th></tr>${syms.map(wlRow).join('')}</table>`
    : '<div class="muted">empty — add a symbol</div>';
  $('#wl-updated').textContent = d.updated ? '· ' + new Date(d.updated).toLocaleTimeString() : '';
  const al = d.alerts || [];
  $('#alerts').innerHTML = al.length
    ? `<table><tr><th>id</th><th>symbol</th><th>cond</th><th>status</th><th></th></tr>${al.map(alRow).join('')}</table>`
    : '<div class="muted">no alerts</div>';
}
function wireWatchlist() {
  if (canWrite) { $('#wl-add').style.display = 'flex'; $('#al-add').style.display = 'flex'; }
  const addSym = async () => {
    const s = $('#wl-sym').value.trim().toUpperCase(); if (!s) return;
    if (await postJSON('/api/watchlist', { action: 'add', symbol: s })) { $('#wl-sym').value = ''; loadWatchlist(); }
  };
  $('#wl-addbtn').onclick = addSym;
  $('#wl-sym').addEventListener('keydown', e => { if (e.key === 'Enter') addSym(); });
  $('#al-addbtn').onclick = async () => {
    const s = $('#al-sym').value.trim().toUpperCase(), op = $('#al-op').value,
      price = parseFloat($('#al-price').value), note = $('#al-note').value.trim();
    if (!s || isNaN(price)) { say('symbol + price required', 'err'); return; }
    const d = await postJSON('/api/alerts', { action: 'add', symbol: s, op, price, note });
    if (d) { $('#al-price').value = ''; $('#al-note').value = ''; say(d.message, 'pos'); loadWatchlist(); }
  };
  document.addEventListener('click', async e => {
    const sym = e.target.closest('[data-wl-sym]');
    if (sym) { e.preventDefault(); $('#symbol').value = sym.dataset.wlSym; loadChart(); return; }
    const rm = e.target.closest('[data-wl-rm]');
    if (rm) { if (await postJSON('/api/watchlist', { action: 'remove', symbol: rm.dataset.wlRm })) loadWatchlist(); return; }
    const alf = e.target.closest('[data-al-for]');
    if (alf) { $('#al-sym').value = alf.dataset.alFor; $('#al-price').focus(); return; }
    const alt = e.target.closest('[data-al-toggle]');
    if (alt) { if (await postJSON('/api/alerts', { action: 'toggle', id: +alt.dataset.alToggle, active: alt.dataset.alActive === '1' })) loadWatchlist(); return; }
    const alr = e.target.closest('[data-al-rm]');
    if (alr) { if (await postJSON('/api/alerts', { action: 'remove', id: +alr.dataset.alRm })) loadWatchlist(); return; }
  });
}

// ── boot ────────────────────────────────────────────────────────────────────
(async () => {
  const cfg = await j('/api/config');
  wireWrites(cfg);
  wireWatchlist();
  // Build symbol suggestions from watches + aliases + DB history
  const watchSyms = cfg.watches.map(w => w.symbol);
  const aliasKeys = Object.keys(cfg.aliases || {});
  const aliasVals = Object.values(cfg.aliases || {});
  const dbSyms = cfg.db_symbols || [];
  const allSyms = [...new Set([...watchSyms, ...aliasKeys, ...aliasVals, ...dbSyms])];
  if (!allSyms.length) allSyms.push('SOL-USDT-SWAP');
  $('#symbol-list').innerHTML = allSyms.map(s => `<option value="${esc(s)}">`).join('');
  $('#symbol').value = watchSyms[0] || allSyms[0];
  // Timeframes
  const tfs = [...new Set(cfg.watches.map(w => w.tf))];
  $('#tf').innerHTML = [...new Set([...tfs, '1D', '4H', '1H', '15m'])].map(t => `<option>${esc(t)}</option>`).join('');
  // Events
  $('#reload').onclick = () => { loadChart(); loadPanels(); };
  $('#tf').onchange = loadChart;
  // Symbol: load chart on Enter key or when selecting from datalist
  $('#symbol').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); loadChart(); } });
  $('#symbol').addEventListener('change', loadChart);
  await Promise.all([loadPanels(), loadChart(), loadWatchlist()]);
  // live-ish refresh of the watchlist prices + alert states (server-configured)
  setInterval(loadWatchlist, Math.max(2, wlPollSeconds) * 1000);
  // Auto-refresh the chart every 30s without resetting the viewer's zoom/pan.
  setInterval(() => loadChart(false), 30000);
})();
</script>
</body>
</html>
