[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "break-signal"
version = "0.2.0"
description = "Automated trendline detection & breakout alerts for OKX (Telegram + Discord)"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
    "websockets>=12,<13",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "mplfinance>=0.12.10b0",
    "matplotlib>=3.8,<4",
    "pydantic>=2.6,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
ai = ["mcp>=1.2", "anthropic>=0.40", "google-genai>=1.0"]   # journal MCP server (Claude Code) + Telegram /ask coach (Anthropic or Gemini)

[project.scripts]
break-signal = "break_signal.__main__:main"
break-signal-journal = "break_signal.journal.cli:main"
break-signal-journal-mcp = "break_signal.journal.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"break_signal.journal" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Anthropic API (needs ANTHROPIC_API_KEY, costs money)"]
